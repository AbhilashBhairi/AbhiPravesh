<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - JNTUH Portal</title>
    <style>
        /* Modern CSS Reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #333d29; 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism Navigation */
        nav { 
            position: fixed; top: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(194, 197, 170, 0.5); 
            padding: 1rem 5%; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.5px; color: #656d4a; text-decoration: none; }
        .logo span { color: #333d29; }
        .nav-links { display: none; } 
        
        .mobile-menu-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #333d29;
        }

        /* Buttons */
        .btn-primary {
            background-color: #656d4a; color: white; border: none; padding: 0.875rem 2rem;
            font-weight: 600; font-size: 1rem; border-radius: 9999px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background-color: #414833; }
        
        .btn-submit { background-color: #333d29; width: 100%; margin-top: 1rem; padding: 1rem; border-radius: 8px; }
        .btn-submit:hover { background-color: #582f0e; }

        /* SaaS Cards & Form Containers */
        .card {
            background: white; padding: 2rem; border-radius: 16px;
            border: 1px solid #c2c5aa; margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: #333d29; }

        /* DASHBOARD STYLING */
        .dashboard-container {
            padding: 8rem 5% 4rem; /* Clears nav */
            max-width: 1200px; /* Widened for monitors */
            margin: 0 auto;
        }
        .dashboard-header { margin-bottom: 2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 1rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #414833; font-size: 0.95rem; }
        .form-control {
            width: 100%; padding: 0.75rem 1rem;
            border: 1px solid #c2c5aa; border-radius: 8px;
            font-family: inherit; font-size: 1rem;
            background-color: #f8fafc; transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: #656d4a; background-color: white; }
        
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        
        .file-upload-box {
            border: 2px dashed #c2c5aa; padding: 1.5rem; text-align: center;
            border-radius: 8px; background-color: #f8fafc; cursor: pointer; transition: all 0.2s;
        }
        .file-upload-box:hover { border-color: #656d4a; background-color: white; }

        @media (min-width: 768px) {
            .mobile-menu-btn { display: none; }
            .nav-links { display: flex; gap: 2rem; align-items: center; }
            .nav-links a { color: #414833; text-decoration: none; font-weight: 500; transition: color 0.2s; cursor: pointer;}
            .nav-links a:hover { color: #7f4f24; }
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <!-- Logo acts as a standard link back to the homepage -->
        <a href="/" class="logo">Edu<span>Portal</span></a>
        <button class="mobile-menu-btn">☰</button>
        <div class="nav-links">
            <a href="/application">Student Login</a>
            <a onclick="alert('Admin view coming later!')">College Admin</a>
        </div>
    </nav>

    <!-- The Standalone Form -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2 style="font-size: 2rem; color: #333d29;">Application Form</h2>
            <p style="color: #656d4a;">Complete your details to generate your application ID.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('We need a database to save this! Let\'s build Supabase next.');">
            
            <div class="card">
                <h3>Academic & Personal Details</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name (As per SSC)</label>
                        <input type="text" class="form-control" placeholder="e.g. Rahul Kumar" required>
                    </div>
                    <div class="form-group">
                        <label>Reservation Category</label>
                        <select class="form-control" required>
                            <option value="">Select Category...</option>
                            <option value="OC">OC (Open Category)</option>
                            <option value="BCA">BC-A</option>
                            <option value="BCB">BC-B</option>
                            <option value="SC">SC</option>
                            <option value="ST">ST</option>
                            <option value="EWS">EWS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>TS EAMCET Hall Ticket No.</label>
                        <input type="text" class="form-control" placeholder="e.g. 2324A0123" required>
                    </div>
                    <div class="form-group">
                        <label>TS EAMCET Rank</label>
                        <input type="number" class="form-control" placeholder="e.g. 12450" required>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Branch Preferences</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Admission Quota</label>
                        <select class="form-control" required>
                            <option value="">Select Quota...</option>
                            <option value="A">Category-A (Convenor Quota)</option>
                            <option value="B">Category-B (Management Quota)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>1st Preference Branch</label>
                        <select class="form-control" required>
                            <option value="">Select Branch...</option>
                            <option value="CSE">Computer Science & Engineering (CSE)</option>
                            <option value="CSM">CSE - AI & Machine Learning (CSM)</option>
                            <option value="ECE">Electronics & Communication (ECE)</option>
                            <option value="IT">Information Technology (IT)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Document Verification (ePASS)</h3>
                <p style="font-size: 0.9rem; color: #582f0e; margin-bottom: 1.5rem;">Upload clear PDF or JPG formats. Max size 2MB per file.</p>
                <div class="form-grid" style="margin-top: 0;">
                    <div class="form-group">
                        <label>SSC Memo</label>
                        <div class="file-upload-box">📄 Click to upload SSC</div>
                    </div>
                    <div class="form-group">
                        <label>TS EAMCET Rank Card</label>
                        <div class="file-upload-box">📄 Click to upload Rank Card</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-submit">Submit Application</button>
        </form>
    </div>

</body>
</html>
